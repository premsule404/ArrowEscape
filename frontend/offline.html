<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Arrow Escape — Offline Mode</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121826">
    <style>
        body {
            background-color: #121826;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 36px 28px;
            border-radius: 24px;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .offline-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .retry-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>You are Offline</h1>
        <p>No internet connection detected. You can continue playing cached levels offline. Progress will automatically sync when connection returns.</p>
        <button class="retry-btn" onclick="window.location.href='./index.html'">Retry Connection</button>
    </div>
</body>
</html>
